name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege: every job only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

# Every job sets RUSTUP_TOOLCHAIN. It takes precedence over the repository's
# rust-toolchain.toml (which pins the MSRV for local builds), so the "stable"
# legs really run current stable instead of silently running 1.85.0.
#
# dtolnay/rust-toolchain publishes no release tags, so it is pinned to a
# commit SHA. Other actions are pinned to their current major version.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85.0"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Toolchain in use
        run: rustc --version && cargo --version
      - name: Clippy (all features, all targets)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --lib --no-default-features -- -D warnings
      # Includes the doctests of README.md and every docs/*.md guide.
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (default features)
        run: cargo test --lib --tests
      - name: Test (no default features)
        run: cargo test --lib --no-default-features
      - name: Doc
        run: cargo doc --no-deps --all-features

  # Every feature must build, lint and pass its unit tests on its own, with
  # no default features (cargo-hack also runs the no-feature and default
  # builds).
  features:
    name: Feature matrix (cargo-hack)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Clippy, each feature alone
        run: cargo hack clippy --lib --each-feature --no-dev-deps -- -D warnings
      - name: Unit tests, each feature alone
        run: cargo hack test --lib --each-feature

  beta:
    name: Test (ubuntu-latest / beta, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  docs-rs:
    name: docs.rs build (nightly, --cfg docsrs)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Line coverage with threshold
        run: >-
          cargo llvm-cov --all-features --lib --tests --summary-only
          --fail-under-lines 90
          --ignore-filename-regex '(benches|examples)/'
      - name: LCOV report
        run: >-
          cargo llvm-cov --all-features --lib --tests --lcov
          --output-path lcov.info
          --ignore-filename-regex '(benches|examples)/'
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  examples:
    name: Examples (build and run)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build every example
        run: cargo build --examples --all-features
      - name: Run the non-blocking examples
        run: bash tools/run_examples.sh

  semver:
    name: SemVer check (vs crates.io)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Audits the committed Cargo.lock.
      - name: Audit
        run: cargo audit --deny warnings

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  udeps:
    name: Unused dependencies (cargo-udeps)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - run: cargo udeps --all-targets --all-features

  publish-dry-run:
    name: Package (publish dry run)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked
