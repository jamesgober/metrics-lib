name: Benchmarks

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # nightly, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  criterion:
    name: Criterion (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      # Pushes the history to gh-pages on main.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Set the CPU governor to performance
        run: |
          for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            [ -f "$f" ] && echo performance | sudo tee "$f" >/dev/null || true
          done
      - name: Run benchmarks
        run: |
          cargo bench --all-features --bench metrics_bench -- --warm-up-time 2 --measurement-time 3 --sample-size 50
          cargo bench --all-features --bench registry_bench -- --warm-up-time 2 --measurement-time 3 --sample-size 50
      # One entry per <group>/<function>[/<input>], in ns per iteration.
      - name: Aggregate Criterion estimates
        id: aggregate
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          entries=()
          for f in target/criterion/**/new/estimates.json; do
            name="${f#target/criterion/}"
            name="${name%/new/estimates.json}"
            mean=$(jq -r '.mean.point_estimate' "$f")
            entries+=("$(jq -cn --arg n "$name" --argjson v "$mean" '{name:$n, value:$v, unit:"ns/iter"}')")
          done
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${entries[@]}" | jq -s . > criterion-summary.json
          echo "found=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.aggregate.outputs.found == 'true'
        with:
          name: criterion
          path: |
            criterion-summary.json
            target/criterion
          retention-days: 14
      - name: Store history on gh-pages
        if: steps.aggregate.outputs.found == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Criterion
          tool: customSmallerIsBetter
          output-file-path: criterion-summary.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmark-data
          # Shared runners are noisy: report, do not fail.
          fail-on-alert: false
          alert-threshold: "150%"
      - name: Regression report (non-blocking)
        if: steps.aggregate.outputs.found == 'true'
        continue-on-error: true
        run: CI_MODE=1 node tools/bench_regression_check.js
