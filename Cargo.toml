[package]
name    = "metrics-lib"
version = "2.0.0"

# Minimum Supported Rust Version (MSRV). Raising it is a MAJOR change.
rust-version = "1.85"
edition = "2024"

license = "Apache-2.0 OR MIT"
readme = "README.md"

description = "Lock-free metrics for Rust: counters, gauges, timers, histograms, summaries and rate meters behind a bounded, validated registry, with spec-valid Prometheus/OpenMetrics output, StatsD/OTLP/JSON exporters and optional process metrics."

keywords = ["metrics", "prometheus", "openmetrics", "telemetry", "observability"]
categories = ["development-tools::profiling", "development-tools::debugging", "concurrency"]

homepage      = "https://github.com/jamesgober/metrics-lib"
repository    = "https://github.com/jamesgober/metrics-lib"
documentation = "https://docs.rs/metrics-lib"

authors = ["James Gober <me@jamesgober.com>"]

# Ship the library, its user-facing docs, tests, benches and examples; keep
# repository tooling (CI, deny config, observability assets) out of the
# published crate.
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/benches/**/*.rs",
    "/examples/**/*.rs",
    "/docs/*.md",
    "/docs/release/v2.0.0.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `sysinfo` is only compiled for targets without an in-house backend (the
# BSDs and others), so on Linux, macOS and Windows runners cargo-udeps reports
# it as unused. That is a false positive.
[package.metadata.cargo-udeps.ignore]
normal = ["sysinfo"]



# FEATURE FLAGS
# #################################
[features]
# Default build: counters, gauges, timers and lazily-started system metrics.
default = ["count", "gauge", "timer", "system"]

# Metric types. Each flag gates one module plus its registry and exporter
# support. `count` also provides `ShardedCounter` and `UpDownCounter`.
count     = []
gauge     = []
timer     = []
meter     = []
# `Histogram` (explicit buckets, exemplars) and `Summary` (streaming quantiles).
histogram = []

# Adaptive sampler, circuit breaker and backpressure controller.
sample = []

# Process and host metrics (`SystemHealth`, standard `process_*` series).
# Reads `/proc` on Linux and the OS directly on Windows and macOS; `sysinfo`
# is used only on other targets. Nothing is sampled and no thread is started
# until the first call to `MetricsCore::system()`.
system = ["dep:sysinfo"]

# Tokio helpers: async timer guards, `TimedFuture`, `AsyncMetricBatch`,
# `AsyncMetricsBatcher` and the Tokio runtime-metrics collector.
async = ["dep:tokio", "dep:pin-project-lite"]

# `Serialize` for stats/snapshot types plus the JSON snapshot exporter.
serde = ["dep:serde", "dep:serde_json"]

# StatsD / DogStatsD UDP exporter (std only, no extra dependencies).
statsd = []

# OTLP exporter: HTTP+JSON payloads (needs `serde`) and hand-encoded protobuf
# payloads (no extra dependencies).
otlp = ["serde"]

# Dependency-free HTTP helpers: a blocking `/metrics` server and a Prometheus
# Pushgateway client (plain HTTP over `std::net`).
http = []

# `tracing` integration: span-wrapped timing and exemplar helpers.
tracing = ["dep:tracing"]

# Bridge for the `metrics` facade crate (a `metrics::Recorder` implementation).
metrics-rs = ["dep:metrics", "count", "gauge", "histogram"]

# Tower middleware that records request rate, errors and duration.
tower = ["dep:tower-layer", "dep:tower-service", "dep:http", "dep:pin-project-lite", "count", "histogram"]

# Every built-in exporter.
exporters-all = ["serde", "statsd", "otlp", "http"]

# Aggregates.
minimal = ["count"]
all = ["count", "gauge", "timer", "meter", "sample", "histogram", "system"]
full = [
    "count", "gauge", "timer", "meter", "sample", "histogram", "system",
    "async", "serde", "statsd", "otlp", "http", "tracing", "metrics-rs", "tower",
]



# DEPENDENCIES
# #################################
[dependencies]
# Optional (feature `async`). The portfolio's async runtime (REPS). Only the
# runtime pieces the helpers use are enabled.
tokio = { version = "1.47", default-features = false, features = ["rt", "time", "sync"], optional = true }
# Optional (features `async`, `tower`). Safe pin projection for `TimedFuture`
# and the tower response future, so the crate needs no `unsafe`. Already part
# of tokio's dependency graph.
pin-project-lite = { version = "0.2.14", optional = true }
# Optional (features `serde`, `otlp`). Serialization of stats and payloads.
serde = { version = "1.0.200", features = ["derive"], optional = true }
serde_json = { version = "1.0.120", optional = true }
# Optional (feature `tracing`). Span-wrapped timing and exemplar helpers.
tracing = { version = "0.1.40", default-features = false, features = ["std"], optional = true }
# Optional (feature `metrics-rs`). The `metrics` facade; implementing its
# `Recorder` lets the `metrics` ecosystem record into this crate.
metrics = { version = "0.24", optional = true }
# Optional (feature `tower`). Middleware traits and HTTP request/response types.
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }
http = { version = "1.1", optional = true }

# Optional (feature `system`), and only for targets without an in-house
# backend (FreeBSD and the other BSDs, …): Linux, Windows and macOS read the
# OS directly and never compile it. 0.36 is the newest line whose MSRV (1.75)
# fits ours; 0.37+ needs Rust 1.88. Only sysinfo's `system` component is
# compiled. The soundness fixes shipped in 0.37-0.39 are in components that
# are either not compiled here (users, groups) or never called (motherboard).
[target.'cfg(not(any(target_os = "linux", target_os = "macos", windows)))'.dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"], optional = true }



# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# Benchmark harness. 0.7 is the newest line compatible with MSRV 1.85 (0.8
# needs 1.86). Default features off: no rayon/plotters subtree.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# Property tests (REPS). 1.11 is the newest line with MSRV <= 1.85.
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde_json = "1.0.120"
# Runtime for async tests and examples.
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net"] }
# Examples: an axum `/metrics` endpoint and the tower middleware in context.
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio", "matched-path"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http = "1.1"
# Tests and example for the `metrics-rs` bridge.
metrics = "0.24"

# Parity tests only: the in-house Windows and macOS samplers are compared
# with sysinfo's readings (tests/system_parity.rs). Never shipped.
[target.'cfg(any(windows, target_os = "macos"))'.dev-dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }



# BENCHMARKS
# #################################
[[bench]]
name = "metrics_bench"
harness = false
required-features = ["count", "gauge", "timer", "meter", "histogram"]

[[bench]]
