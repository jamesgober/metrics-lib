[package]
name    = "metrics-lib"
version = "0.9.3"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.70"
edition = "2021"

# License
license = "Apache-2.0"

# Readme
readme = "README.md"

# Description
description = "High-performance Rust metrics library: sub-2ns counters, sub-1ns gauges, nanosecond timers, tumbling-window rate meters, async timing, adaptive sampling, and system health. Cross-platform with minimal dependencies."

# Keywords (5 total)
keywords = [
    "benchmark", 
    "performance", 
    "profiling", 
    "timing", 
    "metrics"
]

# Categories (5 total)
categories = [
    "development-tools::profiling", 
    "memory-management"
]

# Links
homepage      = "https://github.com/jamesgober/metrics-lib"
repository    = "https://github.com/jamesgober/metrics-lib"
documentation = "https://docs.rs/metrics-lib"

# Authors
authors = [
    "James Gober <me@jamesgober.com>"
]



# FEATURE FLAGS
# #################################
[features]
# Core metric types — each gates its own module and re-exports.
count       = []
gauge       = []
timer       = []
meter       = []

# Adaptive sampling / circuit breaker / backpressure controllers.
sample      = []

# Enable running benchmark-style assertions inside `cargo test` (slow,
# timing-coupled; gated and ignored by default).
bench-tests = []

# Enables async support (Tokio runtime helpers + AsyncMetricsBatcher).
async       = ["dep:tokio"]

# Histogram type with configurable buckets and quantile estimation.
histogram   = ["sample"]

# Wire Serde derive support for stats and snapshot types, plus the
# `exporters::json` JSON snapshot exporter (pulls in `serde_json`).
serde       = ["dep:serde", "dep:serde_json"]

# Built-in StatsD UDP exporter (`exporters::statsd`). No new transitive deps
# — uses `std::net::UdpSocket`.
statsd      = []

# Built-in OTLP/HTTP+JSON exporter (`exporters::otlp`). Requires the
# `serde` feature so the OTLP payload can be serialised.
otlp        = ["serde"]

# All built-in exporters (Prometheus + OpenMetrics are always-on; this flag
# adds JSON snapshot + StatsD UDP + OTLP/HTTP+JSON).
exporters-all = ["serde", "statsd", "otlp"]

# Aggregate flags. `all` excludes runtime-dependent features so it can be
# enabled on environments that don't link against Tokio or Serde.
all  = ["count", "gauge", "timer", "meter", "sample", "histogram"]
full = [
    "count", "gauge", "timer", "meter", "sample", "histogram",
    "async", "serde", "statsd", "otlp",
]

# Default build: counters + gauges + timers (the most common subset).
default = ["count", "gauge", "timer"]

# Smallest useful build (counter only).
minimal = ["count"]



# BENCHMARKS
# #################################
[[bench]]
name    = "metrics_bench"
harness = false
required-features = ["meter"]

